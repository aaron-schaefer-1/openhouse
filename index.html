<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summer Hangout | RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00f2ff;
            --deep-blue: #0f172a;
            --slate: #475569;
            --silver: #e2e8f0;
            --glass: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            overflow-x: hidden;
        }

        /* Animated Tropical Background Elements */
        .bg-decor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .floating {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.2));
            animation: float 15s infinite ease-in-out;
            opacity: 0.3;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(10deg); }
            66% { transform: translate(-20px, 20px) rotate(-10deg); }
        }

        /* Modern RSVP Card */
        .card {
            background: var(--card-bg);
            max-width: 450px;
            width: 100%;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Modern Accents */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--accent), #0077be);
        }

        h1 {
            color: var(--deep-blue);
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
        }

        p {
            color: var(--slate);
            font-size: 1rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--deep-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid var(--silver);
            background: #f8fafc;
            font-size: 1rem;
            font-family: inherit;
            color: var(--deep-blue);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            border: none;
            border-radius: 18px;
            background: var(--deep-blue);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2);
        }

        button:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 242, 255, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .tropical-footer {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.2rem;
            filter: grayscale(0.2);
        }
    </style>
</head>
<body>

    <div class="bg-decor">
        <div class="floating" style="top: 15%; left: 10%; animation-delay: 0s;">🐬</div>
        <div class="floating" style="top: 70%; left: 80%; animation-delay: -5s;">🌴</div>
        <div class="floating" style="top: 20%; left: 75%; animation-delay: -2s;">🌊</div>
        <div class="floating" style="top: 80%; left: 15%; animation-delay: -8s;">🥥</div>
    </div>

    <div class="card">
        <h1>Summer RSVP</h1>
        <p>Silver sands, modern beats, and great company. You coming?</p>
        
        <form action="#">
            <div class="form-group">
                <label>Guest Name</label>
                <input type="text" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select>
                    <option>Definitely there</option>
                    <option>On the fence</option>
                    <option>Catch you next time</option>
                </select>
            </div>

            <div class="form-group">
                <label>Plus Ones</label>
                <input type="number" min="0" value="0">
            </div>

            <button type="submit">Confirm Attendance</button>
        </form>

        <div class="tropical-footer">
            <span>🌴</span>
            <span>🐬</span>
            <span>✨</span>
        </div>
    </div>

</body>
</html>
