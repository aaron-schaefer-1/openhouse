<!-- 1. Firebase Core & Database SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    // 2. Your specific Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB4iOpTfrH2UTMbVaN6BodtL5D_b0FU16k",
        authDomain: "summerrsvp-8fab0.firebaseapp.com",
        projectId: "summerrsvp-8fab0",
        storageBucket: "summerrsvp-8fab0.firebasestorage.app",
        messagingSenderId: "825211696291",
        appId: "1:825211696291:web:27b92f2c6fc5fda4b43b16",
        databaseURL: "https://summerrsvp-8fab0-default-rtdb.firebaseio.com" // Standard URL format for Firebase
    };

    // 3. Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const eventRef = db.ref('after-church-event');

    // 4. Selection State (for the UI)
    let selectedNum = null;
    let selectedItem = null;

    // 5. LIVE SYNC: Listen for updates from the cloud
    eventRef.on('value', (snapshot) => {
        const data = snapshot.val() || { total: 0, items: { chips: 0, sides: 0, drinks: 0, dessert: 0, other: 0 } };
        
        document.getElementById('live-count').innerText = data.total || 0;
        document.getElementById('count-chips').innerText = data.items?.chips || 0;
        document.getElementById('count-sides').innerText = data.items?.sides || 0;
        document.getElementById('count-drinks').innerText = data.items?.drinks || 0;
        document.getElementById('count-dessert').innerText = data.items?.dessert || 0;
        document.getElementById('count-other').innerText = data.items?.other || 0;
    });

    // 6. SUBMIT RSVP
    function submitRSVP() {
        if(!selectedNum) { document.getElementById('rsvp-error').style.display = 'block'; return; }
        
        eventRef.child('total').transaction((current) => {
            return (current || 0) + selectedNum;
        });
        closeModal('rsvpModal');
    }

    // 7. SUBMIT ITEM
    function submitItem() {
        if(!selectedItem) { document.getElementById('item-error').style.display = 'block'; return; }
        
        eventRef.child('items').child(selectedItem).transaction((current) => {
            return (current || 0) + 1;
        });
        closeModal('bringModal');
    }

    // 8. ADMIN RESET (?admin=true)
    function resetAllData() {
        if(confirm("Wipe all global data?")) {
            eventRef.set({
                total: 0,
                items: { chips: 0, sides: 0, drinks: 0, dessert: 0, other: 0 }
            });
        }
    }

    // UI BUTTON HELPERS
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        selectedNum = null; selectedItem = null;
        document.querySelectorAll('.active').forEach(a => a.classList.remove('active'));
    }

    document.querySelectorAll('.grid-btn').forEach(btn => btn.onclick = function() {
        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active'); selectedNum = parseInt(this.dataset.val);
        document.getElementById('rsvp-error').style.display = 'none';
    });

    document.querySelectorAll('.item-btn').forEach(btn => btn.onclick = function() {
        document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active'); selectedItem = this.dataset.val;
        document.getElementById('item-error').style.display = 'none';
    });

    if (new URLSearchParams(window.location.search).get('admin') === 'true') {
        document.getElementById('admin-panel').style.display = 'block';
    }
</script>
